    name: PR Notification                                                                                                                                                                                                                   
                                                                                                                                                                                                                                            
    on:                                                                                                                                                                                                                                     
      pull_request:                                                                                                                                                                                                                         
        types: [opened, reopened]                                                                                                                                                                                                           
                                                                                                                                                                                                                                            
    permissions:                                                                                                                                                                                                                            
      pull-requests: write                                                                                                                                                                                                                  
      contents: read                                                                                                                                                                                                                        
                                                                                                                                                                                                                                            
    jobs:                                                                                                                                                                                                                                   
      notify:                                                                                                                                                                                                                               
        name: Notificar Revisor do PR                                                                                                                                                                                                       
        runs-on: ubuntu-latest                                                                                                                                                                                                              
        steps:                                                                                                                                                                                                                              
          - name: Registar dados do Pull Request                                                                                                                                                                                            
            run: |                                                                                                                                                                                                                          
              echo "=================================================="                                                                                                                                                                     
              echo "🔔 NOVO PULL REQUEST SUBMETIDO"                                                                                                                                                                                         
              echo "Autor: ${{ github.actor }}"                                                                                                                                                                                             
              echo "Título: ${{ github.event.pull_request.title }}"                                                                                                                                                                         
              echo "Número: #${{ github.event.pull_request.number }}"                                                                                                                                                                       
              echo "Aviso: O colega responsável deve efetuar a revisão."                                                                                                                                                                    
              echo "=================================================="                                                                                                                                                                     
                                                                                                                                                                                                                                            
          - name: Comentar no Pull Request                                                                                                                                                                                                  
            uses: actions/github-script@v7                                                                                                                                                                                                  
            with:                                                                                                                                                                                                                           
              script: |                                                                                                                                                                                                                     
                github.rest.issues.createComment({                                                                                                                                                                                          
                  issue_number: context.issue.number,                                                                                                                                                                                       
                  owner: context.repo.owner,                                                                                                                                                                                                
                  repo: context.repo.repo,                                                                                                                                                                                                  
                  body: '🔔 **Notificação Automática**: Novo Pull Request submetido por @' + context.actor + '!\n\nPor favor, o colega responsável pela revisão proceda à análise do código e aprovação do merge.'                          
                }) 
